<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Digital Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.25rem;
      color: #38bdf8;
    }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 20px;
    }
    .login-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    #app-screen {
      display: none;
      padding: 20px;
      flex-grow: 1;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .section-title {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 24px;
      font-weight: bold;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .menu-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px 16px;
      border-radius: 16px;
      text-align: center;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.2s, background 0.2s;
    }
    .menu-card:active {
      transform: scale(0.96);
      background: #334155;
    }
    .menu-card i {
      font-size: 2.2rem;
    }
    .ai-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      z-index: 100;
      color: white;
      font-size: 1.5rem;
    }
    .ai-modal {
      display: none;
      position: fixed;
      bottom: 95px;
      right: 20px;
      left: 20px;
      max-width: 400px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 101;
    }
    .ai-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .ai-modal-header h3 {
      font-size: 1.1rem;
      color: #38bdf8;
    }
    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .ai-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 0.95rem;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    .mic-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #9333ea;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header id="main-header" style="display: none;">
    <h1>स्वागत आहे, Sujal!</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div id="login-screen">
    <div class="login-card">
      <h2 style="margin-bottom: 20px; color: #38bdf8;">Digital Library</h2>
      <input type="password" id="passcode" placeholder="पासवर्ड टाका...">
      <button onclick="handleLogin()">Login</button>
      <p id="login-error" style="color: #ef4444; margin-top: 10px; font-size: 0.9rem; display: none;">चुकीचा पासवर्ड!</p>
    </div>
  </div>

  <div id="app-screen">
    <h2 class="section-title">मुख्य विभाग</h2>
    <div class="grid-container">
      <a href="https://www.google.com" target="_blank" class="menu-card">
        <i class="fa-solid fa-globe" style="color: #38bdf8;"></i>
        <span>विविध Websites</span>
      </a>
      <a href="https://rojgar.mahaswayam.gov.in" target="_blank" class="menu-card">
        <i class="fa-solid fa-briefcase" style="color: #fb923c;"></i>
        <span>नोकरी विभाग</span>
      </a>
      <a href="https://www.youtube.com" target="_blank" class="menu-card">
        <i class="fa-brands fa-youtube" style="color: #f87171;"></i>
        <span>YouTube Saved Video Link</span>
      </a>
      <a href="https://www.instagram.com" target="_blank" class="menu-card">
        <i class="fa-solid fa-camera-retro" style="color: #e879f9;"></i>
        <span>Instagram Saved Video Links</span>
      </a>
    </div>
  </div>

  <!-- AI बटण आणि विंडो -->
  <div class="ai-fab" id="ai-fab" onclick="toggleAiModal()" style="display: none;">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
  </div>

  <div class="ai-modal" id="ai-modal">
    <div class="ai-modal-header">
      <h3>✨ AI Assistant</h3>
      <button class="close-btn" onclick="toggleAiModal()">&times;</button>
    </div>
    <p id="ai-status" style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">तयार आहे...</p>
    <div class="ai-box" id="ai-response">तुम्हाला काय मदत हवी आहे? खालील बटण दाबून बोला.</div>
    <button class="mic-btn" id="micBtn" onclick="startVoiceRecognition()">
      <i class="fa-solid fa-microphone"></i> <span>बोलून विचारा</span>
    </button>
  </div>

  <script>
    // १. लॉगिन सिस्टिम
    function handleLogin() {
      const code = document.getElementById("passcode").value;
      if (code === "Sun@0909") {
        localStorage.setItem("userLoggedIn", "true");
        showApp();
      } else {
        const err = document.getElementById("login-error");
        err.style.display = "block";
      }
    }

    function showApp() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
      document.getElementById("main-header").style.display = "flex";
      document.getElementById("ai-fab").style.display = "flex";
    }

    function logout() {
      localStorage.removeItem("userLoggedIn");
      location.reload();
    }

    window.onload = function() {
      if (localStorage.getItem("userLoggedIn") === "true") {
        showApp();
      }
    };

    // २. AI विंडो उघडणे/बंद करणे
    function toggleAiModal() {
      const modal = document.getElementById("ai-modal");
      modal.style.display = (modal.style.display === "block") ? "none" : "block";
    }

    function getCurrentScreenDetails() {
      return "वापरकर्ता डिजिटल लायब्ररीच्या मुख्य स्क्रीनवर आहे. येथे विविध Websites, नोकरी विभाग, YouTube Saved Video Link, आणि Instagram Saved Video Links चे बटन्स आहेत.";
    }

    // ३. व्हॉइस रेकॉर्डिंग सिस्टिम
    function startVoiceRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("तुमच्या ब्राउझरमध्ये व्हॉइस सपोर्ट नाही. कृपया Chrome ब्राउझर वापरा.");
        return;
      }

      const rec = new SpeechRec();
      rec.lang = "mr-IN";

      const status = document.getElementById("ai-status");
      const micBtn = document.getElementById("micBtn");

      rec.onstart = function() {
        micBtn.innerHTML = "<i class='fa-solid fa-circle-dot' style='color:#f87171;'></i> <span>ऐकत आहे...</span>";
        status.innerText = "बोला, मी ऐकत आहे...";
      };

      rec.onresult = function(e) {
        const speech = e.results[0][0].transcript;
        status.innerText = "विचारलेला प्रश्न: " + speech;
        askAI(speech);
      };

      rec.onerror = function() {
        micBtn.innerHTML = "<i class='fa-solid fa-microphone'></i> <span>बोलून विचारा</span>";
        status.innerText = "आवाज समजला नाही, पुन्हा प्रयत्न करा.";
      };

      rec.onend = function() {
        micBtn.innerHTML = "<i class='fa-solid fa-microphone'></i> <span>बोलून विचारा</span>";
      };

      rec.start();
    }

    // ४. मोफत AI कॉल (कोणत्याही API Key किंवा मॉडेल एरर शिवाय)
    async function askAI(userQuestion) {
      const status = document.getElementById("ai-status");
      const resBox = document.getElementById("ai-response");

      status.innerText = "AI विचार करत आहे...";
      const screenContext = getCurrentScreenDetails();
      const systemPrompt = "तुम्ही 'My Digital Library' चे मदतनीस आहात. संदर्भ: " + screenContext + "। विचारलेल्या प्रश्नाचे सोप्या आणि स्पष्ट मराठीत २-३ वाक्यांत उत्तर द्या.";

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userQuestion }
            ],
            model: "openai"
          })
        });

        const reply = await response.text();

        if (reply && reply.trim().length > 0) {
          resBox.innerText = reply;
          status.innerText = "AI चे उत्तर:";
          speakAnswer(reply);
        } else {
          resBox.innerText = "उत्तर मिळाले नाही, कृपया पुन्हा विचारा.";
          status.innerText = "अडचण आली!";
        }
      } catch (err) {
        resBox.innerText = "कनेक्शन समस्या: " + err.message;
        status.innerText = "एरर!";
      }
    }

    // ५. आवाजात उत्तर वाचणे
    function speakAnswer(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = "mr-IN";
        window.speechSynthesis.speak(utt);
      }
    }
  </script>
</body>
</html>
