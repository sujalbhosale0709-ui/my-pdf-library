<title>My Digital Library</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b132b; color: #ffffff; min-height: 100vh; padding: 20px 10px; }
.container { max-width: 500px; margin: 0 auto; }

/* Header & Card */
.header-box { text-align: center; margin-bottom: 25px; }
.header-box h1 { font-size: 26px; color: #48cae4; margin-bottom: 5px; }
.header-box p { font-size: 14px; color: #94a3b8; }

/* Login Box */
#login-section { background: #1c2541; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid #3a506b; }
.input-group { margin-bottom: 15px; }
.input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
.input-group input { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #3a506b; background: #0b132b; color: #fff; font-size: 15px; outline: none; }
.input-group input:focus { border-color: #48cae4; }
.btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #0077b6; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.btn-primary:hover { background: #0096c7; }

/* Dashboard Sections */
#dashboard-section { display: none; }
.user-bar { display: flex; justify-content: space-between; align-items: center; background: #1c2541; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #3a506b; }
.user-bar span { color: #48cae4; font-weight: bold; font-size: 15px; }
.btn-logout { background: #e63946; color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }

/* Grid Layouts */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card-folder { background: #1c2541; padding: 20px 10px; border-radius: 14px; text-align: center; cursor: pointer; border: 1px solid #3a506b; transition: transform 0.15s, background 0.15s; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card-folder:hover { transform: translateY(-3px); background: #233154; border-color: #48cae4; }
.card-folder .icon { font-size: 32px; margin-bottom: 8px; }
.card-folder .title { font-size: 14px; font-weight: 600; line-height: 1.3; }

/* Sub Pages */
.sub-page { display: none; }
.top-nav { display: flex; align-items: center; margin-bottom: 18px; gap: 12px; }
.btn-back { background: #3a506b; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
.page-heading { font-size: 18px; color: #48cae4; font-weight: bold; }
